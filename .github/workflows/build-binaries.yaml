name: Build packaged binaries

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Diagnostic build (Windows x64)
    runs-on: windows-2022
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Setup npm 8
      run: npm install --global npm@8.19.4

    - name: Setup Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure native build toolchain
      run: |
        "npm_config_python=${{ steps.setup-python.outputs.python-path }}" >> $env:GITHUB_ENV
        "npm_config_msvs_version=2022" >> $env:GITHUB_ENV

    - name: Print toolchain versions
      run: |
        node --version
        npm --version
        python --version
        $gypPkg = Join-Path (npm root -g) 'npm/node_modules/node-gyp/package.json'
        if (Test-Path $gypPkg) {
          node -e "const fs=require('fs');console.log('npm bundled node-gyp: '+JSON.parse(fs.readFileSync(process.argv[1],'utf8')).version)" "$gypPkg"
        } else {
          Write-Host "npm bundled node-gyp: not found at $gypPkg"
        }

    - name: Install dependencies
      run: npm ci

    - name: Build Windows package (no publishing)
      run: npm run build-windows -- --x64 -p never

    - name: Upload dist
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-dist
        path: dist/**
        if-no-files-found: error
