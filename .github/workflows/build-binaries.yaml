name: Build packaged binaries

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Diagnostic build (Windows x64)
    runs-on: windows-2022
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Setup npm 7
      run: npm install --global npm@7.24.2

    - name: Print toolchain versions
      run: |
        node --version
        npm --version

    - name: Install dependencies
      run: npm ci

    - name: Build Windows package (no publishing)
      run: npm run build-windows -- --x64 -p never

    - name: Upload dist
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-dist
        path: dist/**
        if-no-files-found: error
